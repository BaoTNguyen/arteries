experimental_compact_prompt_file = "../.arteries/codex/compact_prompt.txt"
[features]
hooks = true

# arteries:start - managed by `art setup codex`
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = "PLUGIN_DATA=1 node /home/bao-tn/Coding/Projects/arteries/.arteries/hooks/arteries-activate.cjs"
statusMessage = "Activating arteries memory"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "PLUGIN_DATA=1 node /home/bao-tn/Coding/Projects/arteries/.arteries/hooks/arteries-observe.cjs"
statusMessage = "arteries"

[[hooks.PreCompact]]
matcher = "manual|auto"

[[hooks.PreCompact.hooks]]
type = "command"
command = "ARTERIES_CLI=codex bash /home/bao-tn/Coding/Projects/arteries/.arteries/hooks/hook-compact-packet.sh codex-precompact"
statusMessage = "Building arteries continuity packet"

[[hooks.SubagentStart]]
matcher = "*"

[[hooks.SubagentStart.hooks]]
type = "command"
command = "ARTERIES_CLI=codex bash /home/bao-tn/Coding/Projects/arteries/.arteries/hooks/hook-event.sh SubagentStart"
statusMessage = "Recording arteries subagent metadata"

[[hooks.SubagentStop]]
matcher = "*"

[[hooks.SubagentStop.hooks]]
type = "command"
command = "ARTERIES_CLI=codex bash /home/bao-tn/Coding/Projects/arteries/.arteries/hooks/hook-event.sh SubagentStop"
statusMessage = "Recording arteries subagent metadata"
# arteries:end
