name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: arteries

      # arteries imports capillaries by name (memory_types, eval), so the suite
      # cannot collect without it. Which capillaries is the point of the matrix:
      # a PR into main is judged against capillaries' main, work on dev against
      # capillaries' dev — so a change that needs an unlanded capillaries change
      # goes green on dev and red on the PR, which is when you want to hear it.
      - uses: actions/checkout@v7
        with:
          repository: BaoTNguyen/capillaries
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: capillaries

      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: '3.12'

      # uv resolves capillaries from ../capillaries through [tool.uv.sources],
      # the same way a local checkout does, so its own pyproject supplies the
      # transitive deps arteries reaches through it. Not --locked: uv.lock
      # records capillaries' metadata, which moves whenever capillaries does.
      - working-directory: arteries
        run: uv sync && uv run pytest -q
