[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arteries"
version = "0.1.0"
description = "Always-on memory layer for prompt retrieval"
requires-python = ">=3.10"
# capillaries isn't on PyPI, so a bare name in `dependencies` would end up in
# the package metadata and resolve to a stranger's package for anything that
# reads it. It lives in the `dev` group below instead, where [tool.uv.sources]
# pins it to the sibling checkout. `uv sync` installs it.
dependencies = [
    "psycopg2-binary>=2.9.0",
    "httpx>=0.24.0",
]

# rdflib is needed only by `art ontology load`, which runs by hand, once, when
# you change your vocabulary. Grounding at runtime reads the parsed T-Box out of
# Postgres and matches with stdlib difflib, so the hook path never imports it.
[project.optional-dependencies]
ontology = ["rdflib>=7.0.0"]

# `uv sync` installs this by default. Capillaries is a hard runtime
# requirement, not a dev convenience; see the note above `dependencies`.
[dependency-groups]
dev = [
    "capillaries",
    "pytest>=8.0",
]

[tool.uv.sources]
capillaries = { path = "../capillaries", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
art = "arteries.cli:main"
