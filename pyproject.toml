[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arteries"
version = "0.1.0"
description = "Always-on memory layer for prompt retrieval"
requires-python = ">=3.10"
# capillaries is required but undeclared: it isn't on PyPI, so declaring it
# would resolve to a stranger's package. Install the sibling first:
#   pip install -e ../capillaries && pip install -e .
dependencies = [
    "psycopg2-binary>=2.9.0",
    "httpx>=0.24.0",
]

# rdflib is needed only by `art ontology load`, which runs by hand, once, when
# you change your vocabulary. Grounding at runtime reads the parsed T-Box out of
# Postgres and matches with stdlib difflib, so the hook path never imports it.
[project.optional-dependencies]
ontology = ["rdflib>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
art = "arteries.cli:main"
