[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arteries"
version = "0.1.0"
description = "Always-on memory layer for prompt retrieval"
requires-python = ">=3.10"
# capillaries is required but undeclared: it isn't on PyPI, so declaring it
# would resolve to a stranger's package. Install the sibling first:
#   pip install -e ../capillaries && pip install -e .
dependencies = [
    "psycopg2-binary>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
art = "arteries.cli:main"
